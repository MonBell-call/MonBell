<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonBell – Login</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font: Plus Jakarta Sans + Be Vietnam Pro -->
  <link href="https://fonts.cdnfonts.com/css/plus-jakarta-sans" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/be-vietnam-pro" rel="stylesheet" />

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #fff5f7;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: "Plus Jakarta Sans", sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">

  <!-- Stiker kucing & uang -->
  <div class="absolute inset-0 pointer-events-none">
    <img src="https://placehold.co/40x40/ff6b9d/ffffff?text=🐱" alt="sticker cat" class="absolute top-10 left-10 animate-pulse" />
    <img src="https://placehold.co/36x36/81c784/white?text=$" alt="money sticker" class="absolute top-32 right-16 animate-bounce" />
    <img src="https://placehold.co/40x40/ff6b9d/ffffff?text=🐱" alt="sticker cat" class="absolute bottom-20 left-20 animate-pulse" />
    <img src="https://placehold.co/32x32/81c784/white?text=$" alt="money sticker" class="absolute bottom-36 right-8 animate-bounce" />
  </div>

  <div class="relative z-10 w-full max-w-sm p-6 bg-white rounded-3xl shadow-lg border border-pink-200">

    <!-- Logo & header -->
    <div class="flex flex-col items-center mb-6">
      <div class="flex items-center justify-center w-16 h-16 rounded-full bg-pink-200 text-white text-3xl shadow-md">🐾</div>
      <h1 class="text-3xl font-bold text-pink-700 mt-2">MonBell</h1>
      <p class="text-sm text-gray-600 mt-1">Your Daily Companion</p>
    </div>

    <form class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-800 mb-1">Nomor Telepon</label>
        <input
          type="tel"
          placeholder="0812 3456 7890"
          class="w-full px-4 py-3 rounded-full border border-pink-200 bg-pink-50 text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-pink-300 shadow-sm"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-800 mb-1">Kata Sandi</label>
        <input
          type="password"
          placeholder="Masukkan password"
          class="w-full px-4 py-3 rounded-full border border-pink-200 bg-pink-50 text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-pink-300 shadow-sm"
        />
      </div>

      <div class="flex flex-col space-y-3 mt-4">
        <a href="#" class="text-xs text-pink-600 hover:text-pink-800 self-end">Lupa Password?</a>

        <button
          type="submit"
          class="w-full py-3 rounded-full bg-gradient-to-r from-pink-400 to-pink-600 text-white font-semibold shadow-md hover:shadow-lg hover:from-pink-500 hover:to-pink-700 transition-all duration-200"
        >
          Sign In
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center my-4">
        <div class="flex-1 border-t border-gray-300"></div>
        <span class="px-3 text-xs text-gray-500">atau</span>
        <div class="flex-1 border-t border-gray-300"></div>
      </div>

      <div class="flex flex-col gap-3">
        <button
          type="button"
          class="w-full py-3 rounded-full border border-gray-300 text-gray-700 text-sm flex items-center justify-center gap-2 hover:bg-pink-50 transition-colors"
        >
          <span>🟢</span> Sign in with Google
        </button>
        <button
          type="button"
          class="w-full py-3 rounded-full border border-pink-300 text-pink-700 text-sm flex items-center justify-center gap-2 hover:bg-pink-100 transition-colors"
        >
          <span>📱</span> Masuk dengan Nomor Telepon
        </button>
      </div>
    </form>

    <!-- Floating MonBell text -->
    <div class="absolute -top-4 -right-6 text-xs text-pink-300 opacity-60">MonBell</div>
  </div>
</body>
</html>
