<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonBell – Login Berhasil</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.cdnfonts.com/css/plus-jakarta-sans" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/be-vietnam-pro" rel="stylesheet" />

  <style>
    body {
      font-family: "Be Vietnam Pro", sans-serif;
      background: #fff5f7;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: "Plus Jakarta Sans", sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">

  <!-- Stiker kucing & uang -->
  <div class="absolute inset-0 pointer-events-none">
    <img src="https://placehold.co/40x40/ff6b9d/ffffff?text=🐱" alt="sticker cat" class="absolute top-8 left-8 animate-pulse" />
    <img src="https://placehold.co/36x36/81c784/white?text=$" alt="money sticker" class="absolute top-24 right-12 animate-bounce" />
    <img src="https://placehold.co/32x32/ff6b9d/ffffff?text=🐱" alt="sticker cat" class="absolute bottom-16 right-10 animate-pulse" />
  </div>

  <div class="relative z-10 w-full max-w-md p-6 bg-white rounded-3xl shadow-lg border border-pink-200 text-center">

    <h1 class="text-2xl font-bold text-pink-700 mb-1">MonBell</h1>
    <h2 class="text-xl font-semibold text-gray-800 mb-6">Login Berhasil!</h2>
    <p class="text-sm text-gray-600 mb-6">Selamat datang kembali</p>

    <!-- Contoh data akun -->
    <div class="bg-pink-50 rounded-2xl p-4 mb-6 border border-pink-200">
      <p class="text-xs text-gray-700 mb-1">Nomor Telepon</p>
      <p class="text-sm font-semibold text-gray-800">0812 3456 7890</p>
      <p class="text-xs text-gray-700 mt-3">Kata Sandi</p>
      <p class="text-sm font-semibold text-gray-800">●●●●●●●●●●●</p>
    </div>

    <a
      href="dashboard.html"
      class="block py-3 px-6 rounded-full bg-gradient-to-r from-pink-400 to-pink-600 text-white font-semibold shadow-md hover:shadow-lg hover:from-pink-500 hover:to-pink-700 transition-all duration-200"
    >
      Lanjutkan ke Dashboard
    </a>

    <!-- Floating MonBell text -->
    <div class="absolute -top-4 -right-6 text-xs text-pink-300 opacity-60">MonBell</div>
  </div>
</body>
</html>
